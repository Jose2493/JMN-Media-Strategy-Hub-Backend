<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>JMN AI Strategist</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0b0b0f;
    color: #e8e8ec;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #status-bar {
    padding: 10px 16px;
    font-size: 13px;
    color: #8a8a95;
    border-bottom: 1px solid #1e1e26;
    display: none;
  }
  #status-bar.visible { display: block; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #6d5bd0;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #17171d;
    border: 1px solid #232330;
    border-bottom-left-radius: 4px;
  }
  .msg.system {
    align-self: center;
    color: #7a7a85;
    font-size: 13px;
    font-style: italic;
  }
  #input-row {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid #1e1e26;
  }
  #input-box {
    flex: 1;
    background: #17171d;
    border: 1px solid #232330;
    border-radius: 10px;
    color: #e8e8ec;
    padding: 12px 14px;
    font-size: 14.5px;
    resize: none;
    font-family: inherit;
    max-height: 120px;
  }
  #input-box:focus { outline: none; border-color: #6d5bd0; }
  #send-btn {
    background: #6d5bd0;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #send-btn:hover:not(:disabled) { background: #5c4bc0; }
  .typing {
    align-self: flex-start;
    color: #7a7a85;
    font-size: 13px;
    padding: 0 4px;
  }
</style>
</head>
<body>

<div id="status-bar"></div>
<div id="messages"></div>
<div id="input-row">
  <textarea id="input-box" rows="1" placeholder="Share what you are noticing about your brand..."></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
  let bootstrapToken = null;
  let sessionToken = null;
  let conversationId = null;
  let renewalTimer = null;
  let hasGreeted = false;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input-box');
  const sendBtn = document.getElementById('send-btn');
  const statusBar = document.getElementById('status-bar');

  function showStatus(text) {
    statusBar.textContent = text;
    statusBar.classList.add('visible');
  }
  function hideStatus() {
    statusBar.classList.remove('visible');
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.textContent = 'Escribiendo...';
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return typingEl;
  }

  async function initSession() {
    const match = window.location.hash.match(/token=([^&]+)/);
    if (match) {
      bootstrapToken = decodeURIComponent(match[1]);
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    if (!bootstrapToken) {
      showStatus('No se encontró una sesión válida. Contacta a JMN Media.');
      return;
    }
    await refreshSession();
  }

  async function refreshSession() {
    try {
      const res = await fetch('/api/session-exchange', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bootstrapToken })
      });
      if (!res.ok) throw new Error('exchange failed');
      const data = await res.json();
      sessionToken = data.sessionToken;
      hideStatus();
      if (renewalTimer) clearTimeout(renewalTimer);
      renewalTimer = setTimeout(refreshSession, (data.expiresInSeconds - 60) * 1000);

      if (!hasGreeted) {
        hasGreeted = true;
        await sendGreeting();
      }
      sendBtn.disabled = false;
      inputEl.disabled = false;
    } catch (err) {
      showStatus('No se pudo iniciar la sesión. Contacta a JMN Media.');
      sendBtn.disabled = true;
      inputEl.disabled = true;
    }
  }

  async function sendGreeting() {
    const typingEl = showTyping();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + sessionToken
        },
        body: JSON.stringify({ greeting: true })
      });
      const data = await res.json();
      typingEl.remove();
      if (res.ok) {
        conversationId = data.conversationId;
        addMessage('assistant', data.reply);
      }
    } catch (err) {
      typingEl.remove();
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || !sessionToken) return;

    addMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    const typingEl = showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + sessionToken
        },
        body: JSON.stringify({ message: text, conversationId })
      });
      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        addMessage('system', 'Hubo un problema procesando tu mensaje. Intenta de nuevo.');
      } else {
        conversationId = data.conversationId;
        addMessage('assistant', data.reply);
      }
    } catch (err) {
      typingEl.remove();
      addMessage('system', 'No se pudo conectar. Revisa tu conexión e intenta de nuevo.');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  sendBtn.disabled = true;
  inputEl.disabled = true;
  initSession();
</script>

</body>
</html>
