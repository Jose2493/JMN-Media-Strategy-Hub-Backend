name: Supabase keep-alive
on:
  schedule:
    - cron: '0 6,13,20 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health check
        run: |
          curl -sf "https://odlgjkxtfrtxnovsjcnl.supabase.co/rest/v1/system_health?select=status" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
